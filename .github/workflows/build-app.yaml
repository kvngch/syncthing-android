name: Build App

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/common-build.yaml
    with:
      buildType: "Debug"
      gradleOptions: "testDebugUnitTest"

  sign:
    name: Sign
    needs: build
    uses: ./.github/workflows/common-sign.yaml
    with:
      applicationId: "com.github.catfriend1.syncthingfork"
      buildType: "debug"
      environmentName: "dev-sign-untrusted"

  # Smoke test on an Android 15 emulator: onboarding, Syncthing start, one screenshot per screen.
  # Fails if the app crashes or if Syncthing never answers.
  captures:
    name: Captures
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-com.github.catfriend1.syncthingfork
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image download fails now and then on the runners: restored from the cache,
      # sdkmanager finds it installed and skips the download.
      - name: Cache emulator system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: emulator-system-image-35-google_apis-x86_64

      - name: Run on emulator
        id: emulator
        # SDK downloads on the runner fail now and then: one more try below.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/captures.sh apk

      - name: Run on emulator, second try
        if: steps.emulator.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/captures.sh apk

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captures
          path: captures/
          retention-days: 7
