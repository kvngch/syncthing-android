name: Release App

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create on main and publish (e.g. v2.1.7.0)'
        required: true

concurrency:
  group: release-app
  cancel-in-progress: true

jobs:
  build1:
    name: Build 1
    uses: ./.github/workflows/common-build.yaml
    with:
      applicationId: "fr.kvngch.synchro"
      buildType: "Release"

  sign1:
    name: Sign 1
    needs: [build1]
    uses: ./.github/workflows/common-sign.yaml
    with:
      applicationId: "fr.kvngch.synchro"
      buildType: "release"
      environmentName: prod
    secrets: inherit

  # Published, not a draft: Obtainium only sees published releases.
  release:
    name: Create release and attach artifacts
    needs: [sign1]
    runs-on: ubuntu-latest
    steps:
      - name: Download sign1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-fr.kvngch.synchro
          path: ./artifacts

      - name: Checksums
        run: cd artifacts && sha256sum *.apk > SHA256SUMS.txt

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.event.inputs.tag }}
          commit: ${{ github.sha }}
          artifacts: "./artifacts/*.apk,./artifacts/SHA256SUMS.txt"
          artifactErrorsFailBuild: true
          name: Synchro ${{ github.event.inputs.tag }}
          body: "APK signés par la clé de release de Synchro. Celui dont le nom ne porte pas d'architecture convient à tous les téléphones ; arm64-v8a convient à presque tous les téléphones récents."
          prerelease: ${{ contains(github.event.inputs.tag, '-rc.') }}
